# Rendered by the nginx image entrypoint (envsubst) from
# /etc/nginx/templates/default.conf.template -> /etc/nginx/conf.d/default.conf.
# BACKEND_URL: http://backend:8000 in Docker Compose,
#              http://taskboard-backend:8000 in Kubernetes (ConfigMap taskboard-config).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # Local Docker Compose and Kubernetes service-to-service API proxy.
  location /api/ {
    proxy_pass ${BACKEND_URL};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /health {
    proxy_pass ${BACKEND_URL}/health;
  }
}
