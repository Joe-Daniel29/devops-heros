# Environment values for the minikube cluster, owned by Git and applied by Argo CD.
# The CI job "Promote image tag (GitOps)" rewrites the two tag fields below with the
# commit SHA of every successful build on main; Argo CD then syncs the change.
frontend:
  image: ghcr.io/joe-daniel29/taskboard-frontend
  tag: 4b7e9d2c81f3a6e05d9b72c4e1a8f3065d2c7b19
backend:
  image: ghcr.io/joe-daniel29/taskboard-backend
  tag: 4b7e9d2c81f3a6e05d9b72c4e1a8f3065d2c7b19
replicaCount: 2
ingress:
  enabled: true
  host: taskboard.local
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
