# Issue 5 - Ingress returns 503: backend port 8080 does not exist on the Service (it listens on 8000).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: taskboard-broken, namespace: taskboard}
spec:
  ingressClassName: nginx
  rules:
  - host: broken.taskboard.local
    http:
      paths:
      - {path: /api, pathType: Prefix, backend: {service: {name: taskboard-backend, port: {number: 8080}}}}
