# Fix 5 - Ingress backend port matches the Service port (8000).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: taskboard-broken, namespace: taskboard}
spec:
  ingressClassName: nginx
  rules:
  - host: broken.taskboard.local
    http:
      paths:
      - {path: /api, pathType: Prefix, backend: {service: {name: taskboard-backend, port: {number: 8000}}}}
