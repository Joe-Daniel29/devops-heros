# Fix 1 - use an image tag that was actually pushed by CI (commit SHA).
apiVersion: apps/v1
kind: Deployment
metadata: {name: taskboard-broken-image, namespace: taskboard}
spec:
  replicas: 1
  selector: {matchLabels: {app: broken-image}}
  template:
    metadata: {labels: {app: broken-image}}
    spec:
      containers:
      - name: backend
        image: ghcr.io/joe-daniel29/taskboard-backend:4b7e9d2c81f3a6e05d9b72c4e1a8f3065d2c7b19
        env:
        - name: DATABASE_URL
          valueFrom: {secretKeyRef: {name: taskboard-postgres, key: database-url}}
