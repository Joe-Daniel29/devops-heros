# Fix 3 - correct password in the DATABASE_URL Secret.
apiVersion: v1
kind: Secret
metadata: {name: taskboard-backend-v2-db, namespace: taskboard}
type: Opaque
stringData:
  database-url: "postgresql+psycopg://taskboard:taskboard@taskboard-postgres:5432/taskboard"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: taskboard-backend-v2, namespace: taskboard}
spec:
  replicas: 1
  selector: {matchLabels: {app: taskboard-backend-v2}}
  template:
    metadata: {labels: {app: taskboard-backend-v2}}
    spec:
      containers:
      - name: backend
        image: ghcr.io/joe-daniel29/taskboard-backend:4b7e9d2c81f3a6e05d9b72c4e1a8f3065d2c7b19
        ports: [{containerPort: 8000}]
        env:
        - name: DATABASE_URL
          valueFrom: {secretKeyRef: {name: taskboard-backend-v2-db, key: database-url}}
