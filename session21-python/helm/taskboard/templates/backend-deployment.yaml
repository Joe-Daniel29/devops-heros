apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskboard.fullname" . }}-backend
  labels: {app: taskboard-backend}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app: taskboard-backend}
  template:
    metadata:
      labels: {app: taskboard-backend}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          ports: [{containerPort: 8000, name: http}]
          env:
            - name: APP_NAME
              valueFrom: {configMapKeyRef: {name: {{ include "taskboard.fullname" . }}-config, key: APP_NAME}}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: taskboard-postgres, key: database-url}}
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
{{ toYaml .Values.resources | indent 12 }}
