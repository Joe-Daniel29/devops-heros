apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskboard.fullname" . }}-config
data:
  APP_NAME: {{ .Values.config.appName | quote }}
  BACKEND_URL: "http://{{ include "taskboard.fullname" . }}-backend:8000"
  DB_HOST: {{ .Values.postgres.host | quote }}
  DB_PORT: "5432"
  DB_NAME: {{ .Values.postgres.database | quote }}
